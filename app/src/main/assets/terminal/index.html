<!DOCTYPE html>
<!--
  Minimal xterm.js host page, loaded from app/src/main/assets/terminal/ into
  a WebView by ui/TerminalScreen.kt.

  Bridge contract with Kotlin (see ssh/SessionListenerImpl.kt and
  ui/TerminalScreen.kt):
    Kotlin -> JS:  webView.evaluateJavascript("window.NexusTerm.writeBase64('...')", null)
                   webView.evaluateJavascript("window.NexusTerm.notifyClosed('reason')", null)
                   ...plus sendKeyBase64 / setModifiers / uiState, used by the
                   extra-keys row in ui/TerminalKeyBar.kt. `uiState` is *read*
                   through evaluateJavascript's result callback: NexusAndroid
                   can't grow new methods without touching TerminalScreen.kt,
                   so pulling is the only way those facts reach Kotlin.
    JS -> Kotlin:  window.NexusAndroid.onTermInput(utf8OrBase64String)   // keystrokes
                   window.NexusAndroid.onResize(cols, rows)              // on fit()
  `NexusAndroid` is the addJavascriptInterface() object registered by
  TerminalScreen.kt. Everything here is deliberately framework-free (no
  bundler): it's a straight copy/trim of the xterm.js UMD build used by the
  desktop app's frontend, wired up by hand.
-->
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<link rel="stylesheet" href="xterm/xterm.css" />
<style>
  html, body { height: 100%; margin: 0; padding: 0; background: #0c0c0c; overflow: hidden; }
  #terminal { height: 100%; width: 100%; }
  .xterm { padding: 4px; }
</style>
</head>
<body>
<div id="terminal"></div>
<script src="xterm/xterm.js"></script>
<script src="xterm/addon-fit.js"></script>
<script>
(function () {
  var term = new Terminal({
    cursorBlink: true,
    fontSize: 14,
    fontFamily: "monospace",
    theme: { background: "#0c0c0c", foreground: "#e6e6e6" },
    scrollback: 5000,
  });
  var fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById("terminal"));
  fitAddon.fit();

  // ---- Sticky Ctrl/Alt ----
  // The extra-keys row (ui/TerminalKeyBar.kt) arms these with a tap and the
  // *next* keystroke spends them, Termux-style. That next keystroke is just as
  // likely to come from the soft keyboard, which reaches us through
  // term.onData and never passes through Kotlin at all -- so the armed flags
  // live here, the one place both input sources meet. Kotlin only mirrors them
  // for painting; a second copy of this logic on that side would have to stay
  // in step across an async bridge, and the window where it didn't is exactly
  // the window where Ctrl+C gets dropped or sent twice.
  var ctrlArmed = false;
  var altArmed = false;

  /** Ctrl+<key> as its VT control code, or null when there isn't one. */
  function controlCode(ch) {
    var c = ch.charCodeAt(0);
    if (c >= 0x61 && c <= 0x7a) return c - 0x60; // a-z
    if (c >= 0x41 && c <= 0x5a) return c - 0x40; // A-Z, same codes
    if (c >= 0x5b && c <= 0x5f) return c - 0x40; // [ \ ] ^ _
    if (ch === " ") return 0x00;                 // Ctrl+Space -> NUL
    if (ch === "?") return 0x7f;                 // Ctrl+? -> DEL
    return null;
  }

  // Only the first character is modified: a paste, an IME commit or an
  // autocorrect replacement all arrive as one multi-character payload, and
  // Ctrl is meant to bind to a keystroke rather than to a whole burst.
  // Anything with no control code (Ctrl+F5 and friends) is sent through
  // unmodified -- better than mangling it -- but still spends the modifier,
  // so an armed Ctrl can never leak into a later keystroke.
  function applyModifiers(data) {
    if (!data || (!ctrlArmed && !altArmed)) return data;
    var head = data.charAt(0);
    var tail = data.slice(1);
    if (ctrlArmed) {
      var code = controlCode(head);
      if (code !== null) head = String.fromCharCode(code);
    }
    if (altArmed) head = "\x1b" + head;
    ctrlArmed = false;
    altArmed = false;
    return head + tail;
  }

  // Keystrokes / pasted text -> Kotlin. We send raw strings (xterm already
  // gives us UTF-16 JS strings); Kotlin re-encodes to UTF-8 bytes before
  // handing them to nexus-core's write(). This mirrors the desktop app's
  // "whatever xterm emits, forward untouched" behaviour for key handling.
  function sendInput(data) {
    if (window.NexusAndroid && window.NexusAndroid.onTermInput) {
      window.NexusAndroid.onTermInput(data);
    }
  }

  term.onData(function (data) {
    sendInput(applyModifiers(data));
  });

  function reportSize() {
    if (window.NexusAndroid && window.NexusAndroid.onResize) {
      window.NexusAndroid.onResize(term.cols, term.rows);
    }
  }

  window.addEventListener("resize", function () {
    fitAddon.fit();
    reportSize();
  });

  // Called once the page is visible so the first resize report reaches
  // Kotlin before any data arrives (cols/rows must be set before PTY/shell
  // request on the Rust side -- see SshClient.kt).
  reportSize();

  // ---- Kotlin -> JS bridge object ----
  // Must be attached to `window` *after* `term` exists, since Kotlin may
  // start calling writeBase64() immediately after the page finishes loading.
  window.NexusTerm = {
    /**
     * Push a base64-encoded chunk of terminal output (raw SSH channel
     * bytes). We decode to a byte string and hand it to term.write(), which
     * accepts Uint8Array | string and understands partial UTF-8 sequences
     * across calls -- exactly the property we need given nexus-core streams
     * raw, possibly-split-mid-character bytes (see ssh/session.rs comment
     * on why the desktop version avoided lossy UTF-8 conversion).
     */
    writeBase64: function (b64) {
      var binary = atob(b64);
      var bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) {
        bytes[i] = binary.charCodeAt(i);
      }
      term.write(bytes);
    },
    notifyClosed: function (reason) {
      term.write("\r\n\x1b[31m[connection closed: " + reason + "]\x1b[0m\r\n");
    },
    clear: function () {
      term.clear();
    },
    fit: function () {
      fitAddon.fit();
      reportSize();
    },

    /**
     * A key tapped on the extra-keys row. The payload is base64 for the same
     * reason writeBase64's is: it carries escape sequences, and base64's
     * alphabet needs no escaping when Kotlin splices it into a JS string
     * literal. Every payload the bar sends is ASCII, so atob() reproduces it
     * exactly.
     *
     * Routed back out through the same sendInput() the soft keyboard uses
     * rather than written to the session from Kotlin, so both input sources
     * share one armed-modifier state and can't race each other.
     */
    sendKeyBase64: function (b64) {
      sendInput(applyModifiers(atob(b64)));
    },

    setModifiers: function (ctrl, alt) {
      ctrlArmed = !!ctrl;
      altArmed = !!alt;
    },

    /**
     * Everything the key bar needs to paint itself, as "<atBottom><ctrl><alt>"
     * in 0/1. Polled by Kotlin through evaluateJavascript's result callback:
     * `window.NexusAndroid` is built in ui/TerminalScreen.kt and can't grow an
     * event for "the user scrolled into the scrollback" or "the armed Ctrl was
     * just spent", so a pull is the only channel available. Three characters
     * keeps the poll cheap and spares the Kotlin side a JSON parse.
     */
    uiState: function () {
      var buf = term.buffer.active;
      return (buf.viewportY >= buf.baseY ? "1" : "0") +
        (ctrlArmed ? "1" : "0") +
        (altArmed ? "1" : "0");
    },
  };
})();
</script>
</body>
</html>
